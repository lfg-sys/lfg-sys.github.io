# Rebuilds the game pages at /g/<id>/ from the app's public catalogue each night (decision 170), after the
# app's Nightly job has published it. Also writes sitemap.xml and robots.txt. Commits only what changed, then asks
# GitHub Pages to publish.
name: Game pages
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: game-pages
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/game_pages.py
      - name: Commit changed pages
        run: |
          git config user.name "Looking For Game pages"
          git config user.email "pages-bot@users.noreply.github.com"
          git add g sitemap.xml robots.txt
          if git diff --cached --quiet; then echo "No page changed"; exit 0; fi
          git commit -q -m "Game pages: nightly refresh"
          git push -q
          gh api -X POST repos/${{ github.repository }}/pages/builds || true
        env:
          GH_TOKEN: ${{ github.token }}
