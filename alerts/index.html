<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Email alerts · Looking For Game</title>
<meta name="theme-color" content="#0B0C10">
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/assets/site.css?v=3">
</head>
<body class="solo">
<main>
  <a class="brand" href="/"><img src="/assets/icon-96.png" alt="" width="32" height="32">Looking For Game</a>
  <div class="card" aria-live="polite">
    <p class="eyebrow" id="eyebrow">EMAIL ALERTS</p>
    <h1 id="title">One moment…</h1>
    <p id="text"></p>
    <div id="actions"></div>
  </div>
  <small>Looking For Game is a trading name of Rung App Ltd. <a href="/privacy/">Privacy</a> · <a href="mailto:lfg@lfgame.co.uk">lfg@lfgame.co.uk</a></small>
</main>
<script>
// The two links in Looking For Game's emails: ?confirm=<code> (switches email alerts on) and ?unsubscribe=<code> (removes the address).
(function () {
  var API = 'https://vulgyfzelewuceatdloj.supabase.co/rest/v1/rpc/';
  var KEY = 'sb_publishable_9TxQtrSnAyZKyibFMWpOqQ_fosdZqnm';
  var q = new URLSearchParams(location.search);
  var UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  var $ = function (id) { return document.getElementById(id); };
  function show(eyebrow, title, text) { $('eyebrow').textContent = eyebrow; $('title').textContent = title; $('text').textContent = text; $('actions').innerHTML = ''; }
  function call(fn, token) {
    return fetch(API + fn, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY }, body: JSON.stringify({ p_token: token }) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  var problem = function () { show('SOMETHING WENT WRONG', "That didn't work.", 'Check your connection and open the link from the email again. If it keeps happening, email lfg@lfgame.co.uk.'); };
  var c = q.get('confirm'), u = q.get('unsubscribe');
  if (c && UUID.test(c)) {
    call('alerts_email_confirm', c).then(function (r) {
      if (r === 'confirmed') show('QUEST COMPLETE', "You're in. Email alerts are on.", "We'll email you when a game on your wishlist drops in price, hits its lowest price yet, or comes out.");
      else if (r === 'expired') show('LINK EXPIRED', 'This link is more than 7 days old.', 'Open Looking For Game, go to You, then Alerts, and press "Send the link again".');
      else show('LINK NOT FOUND', "This link isn't in use any more.", 'The email address may have been changed or removed. Open Looking For Game, go to You, then Alerts, to check.');
    }).catch(problem);
  } else if (u && UUID.test(u)) {
    show('EMAIL ALERTS', 'Stop the emails?', "We'll remove your email address straight away. Alerts on your phone carry on unless you turn them off in the app.");
    var b = document.createElement('button'); b.textContent = 'Unsubscribe';
    b.onclick = function () {
      b.disabled = true;
      call('alerts_email_unsubscribe', u).then(function () {
        show('DONE', "You're unsubscribed.", 'Your email address has been removed and no more emails will come. Changed your mind? Open Looking For Game, go to You, then Alerts, and press "Email me" to turn them back on.');
      }).catch(problem);
    };
    $('actions').appendChild(b);
  } else {
    show('EMAIL ALERTS', 'Open the link from your email.', 'This page confirms or stops Looking For Game email alerts using the link in the email we sent you.');
  }
})();
</script>
</body>
</html>
