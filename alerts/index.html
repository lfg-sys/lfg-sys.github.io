<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Email alerts · LFG – Looking For Game</title>
<meta name="theme-color" content="#0B0C10">
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
  :root { color-scheme: dark; --bg:#0B0C10; --surface:#16181F; --line:#2A2E39; --text:#F2F3F5; --soft:#C9CDD6; --muted:#8B909C; --accent:#B8F35A; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--soft); font: 16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 480px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; text-decoration: none; color: var(--text); font: 700 22px "Space Grotesk", Inter, sans-serif; letter-spacing: -0.02em; }
  .brand img { width: 34px; height: 34px; border-radius: 9px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--accent); border-radius: 18px; padding: 30px 28px; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .16em; color: var(--accent); margin: 0 0 8px; }
  h1 { font: 700 28px/1.2 "Space Grotesk", Inter, sans-serif; letter-spacing: -0.02em; color: var(--text); margin: 0 0 12px; text-wrap: balance; }
  p { margin: 0 0 18px; }
  button, .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 26px; border: 0; border-radius: 999px; background: var(--accent); color: #0B0C10; font: 700 16px Inter, sans-serif; text-decoration: none; cursor: pointer; }
  button:focus-visible, .btn:focus-visible, a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  button[disabled] { opacity: .6; cursor: default; }
  .quiet { background: transparent; color: var(--soft); border: 1px solid #6B7280; margin-left: 8px; }
  small { display: block; margin-top: 18px; color: var(--muted); font-size: 13px; }
  small a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <a class="brand" href="/"><img src="/assets/icon.png" alt="">LFG</a>
  <div class="card" aria-live="polite">
    <p class="eyebrow" id="eyebrow">EMAIL ALERTS</p>
    <h1 id="title">One moment…</h1>
    <p id="text"></p>
    <div id="actions"></div>
  </div>
  <small>LFG – Looking For Game is a trading name of Rung App Ltd. <a href="/privacy/">Privacy</a> · <a href="mailto:lfg@lfgame.co.uk">lfg@lfgame.co.uk</a></small>
</main>
<script>
// The two links in LFG's emails: ?confirm=<code> (switches email alerts on) and ?unsubscribe=<code> (removes the address).
(function () {
  var API = 'https://vulgyfzelewuceatdloj.supabase.co/rest/v1/rpc/';
  var KEY = 'sb_publishable_9TxQtrSnAyZKyibFMWpOqQ_fosdZqnm';
  var q = new URLSearchParams(location.search);
  var UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  var $ = function (id) { return document.getElementById(id); };
  function show(eyebrow, title, text) { $('eyebrow').textContent = eyebrow; $('title').textContent = title; $('text').textContent = text; $('actions').innerHTML = ''; }
  function call(fn, token) {
    return fetch(API + fn, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY }, body: JSON.stringify({ p_token: token }) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  var problem = function () { show('SOMETHING WENT WRONG', "That didn't work.", 'Check your connection and open the link from the email again. If it keeps happening, email lfg@lfgame.co.uk.'); };
  var c = q.get('confirm'), u = q.get('unsubscribe');
  if (c && UUID.test(c)) {
    call('alerts_email_confirm', c).then(function (r) {
      if (r === 'confirmed') show('QUEST COMPLETE', "You're in. Email alerts are on.", "We'll email you when a game on your wishlist drops in price, hits its lowest price yet, or comes out. One email a day at most.");
      else if (r === 'expired') show('LINK EXPIRED', 'This link is more than 7 days old.', 'Open LFG, go to You, then Alerts, and enter your email again to get a new one.');
      else show('LINK NOT FOUND', "This link isn't in use any more.", 'The email address may have been changed or removed. Open LFG, go to You, then Alerts, to check.');
    }).catch(problem);
  } else if (u && UUID.test(u)) {
    show('EMAIL ALERTS', 'Stop the emails?', "We'll remove your email address straight away. Alerts on your phone carry on unless you turn them off in the app.");
    var b = document.createElement('button'); b.textContent = 'Unsubscribe';
    b.onclick = function () {
      b.disabled = true;
      call('alerts_email_unsubscribe', u).then(function () {
        show('DONE', "You're unsubscribed.", 'Your email address has been removed and no more emails will come. You can add it again any time in the app, on the You tab.');
      }).catch(problem);
    };
    $('actions').appendChild(b);
  } else {
    show('EMAIL ALERTS', 'Open the link from your email.', 'This page confirms or stops LFG email alerts using the link in the email we sent you.');
  }
})();
</script>
</body>
</html>
